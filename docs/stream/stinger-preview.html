<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stinger Preview — Wave Transition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a1628;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            color: #fff;
        }
        .preview {
            width: 960px;
            height: 540px;
            background: linear-gradient(135deg, #1a3a5c 0%, #0d1f3c 100%);
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .preview::before {
            content: 'Current Scene';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: rgba(255,255,255,0.3);
            z-index: 0;
        }
        .waves {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }
        .wave-band {
            position: absolute;
            width: 60%;
            height: 14%;
            opacity: 0.95;
            animation: ride 1s ease-in-out forwards;
        }
        .wave-band svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .wave-1 { top: 22%; left: -30%; animation-delay: 0s; }
        .wave-2 { top: 40%; left: -30%; animation-delay: 0.05s; }
        .wave-3 { top: 58%; left: -30%; animation-delay: 0.1s; }
        .wave-4 { top: 76%; left: -30%; animation-delay: 0.15s; }
        @keyframes ride {
            0% { transform: translateX(0); }
            100% { transform: translateX(180%); }
        }
        .info {
            margin-top: 24px;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        .info a { color: #4a90a4; }
        button {
            margin-top: 16px;
            padding: 10px 24px;
            background: #2196f3;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #1976d2; }
    </style>
</head>
<body>
    <div class="preview">
        <div class="waves" id="waves">
            <div class="wave-band wave-1"><svg viewBox="0 0 200 100" preserveAspectRatio="none"><path d="M0,50 Q25,20 50,50 T100,50 T150,50 T200,50 L200,100 L0,100 Z" fill="#ff1464"/></svg></div>
            <div class="wave-band wave-2"><svg viewBox="0 0 200 100" preserveAspectRatio="none"><path d="M0,50 Q25,35 50,50 T100,50 T150,65 T200,50 L200,100 L0,100 Z" fill="#2196f3"/></svg></div>
            <div class="wave-band wave-3"><svg viewBox="0 0 200 100" preserveAspectRatio="none"><path d="M0,50 Q25,65 50,50 T100,50 T150,35 T200,50 L200,100 L0,100 Z" fill="#9fa8da"/></svg></div>
            <div class="wave-band wave-4"><svg viewBox="0 0 200 100" preserveAspectRatio="none"><path d="M0,50 Q50,25 100,50 T200,50 L200,100 L0,100 Z" fill="#673ab7"/></svg></div>
        </div>
    </div>
    <button onclick="replay()">Replay</button>
    <p class="info">
        Preview of the wave stinger. Run <code>python scripts/generate_stinger.py</code> to create the WebM.<br>
        See <a href="STINGER_TRANSITION.md">STINGER_TRANSITION.md</a> for OBS setup.
    </p>

    <script>
        function replay() {
            const waves = document.getElementById('waves');
            waves.style.animation = 'none';
            waves.offsetHeight;
            waves.style.animation = '';
            const wav = new Audio('assets/stinger-swoosh.wav');
            wav.play().catch(() => {});
        }
        window.addEventListener('load', () => setTimeout(replay, 300));
    </script>
</body>
</html>
